<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1320" height="300" fill="#FFFFFF"/>
  <text x="660" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0E2233">Supported Acquisition Types</text>

  <!-- REF -->
  <g>
    <rect x="24" y="60" width="300" height="216" rx="14" fill="#FFFFFF" stroke="#065A82" stroke-width="2"/>
    <rect x="24" y="60" width="300" height="42" rx="14" fill="#065A82"/>
    <rect x="24" y="88" width="300" height="14" fill="#065A82"/>
    <text x="174" y="87" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">REF</text>
    <text x="174" y="122" text-anchor="middle" font-size="12.5" fill="#5A6B78">Unsuppressed water reference</text>
    <text x="54" y="155" font-size="12" fill="#222B33">&#8226; Water peak estimation</text>
    <text x="54" y="178" font-size="12" fill="#222B33">&#8226; Eddy-current correction</text>
    <text x="54" y="201" font-size="12" fill="#222B33">&#8226; Frequency referencing</text>
  </g>

  <!-- REF_RES -->
  <g>
    <rect x="348" y="60" width="300" height="216" rx="14" fill="#FFFFFF" stroke="#1C7293" stroke-width="2"/>
    <rect x="348" y="60" width="300" height="42" rx="14" fill="#1C7293"/>
    <rect x="348" y="88" width="300" height="14" fill="#1C7293"/>
    <text x="498" y="87" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">REF_RES</text>
    <text x="498" y="122" text-anchor="middle" font-size="12.5" fill="#5A6B78">Transient-resolved unsuppressed</text>
    <text x="378" y="155" font-size="12" fill="#222B33">&#8226; Water thermometry</text>
    <text x="378" y="178" font-size="12" fill="#222B33">&#8226; Transient-stability analysis</text>
    <text x="378" y="201" font-size="12" fill="#222B33">&#8226; Dynamic thermometry</text>
  </g>

  <!-- WS -->
  <g>
    <rect x="672" y="60" width="300" height="216" rx="14" fill="#FFFFFF" stroke="#3F8F5F" stroke-width="2"/>
    <rect x="672" y="60" width="300" height="42" rx="14" fill="#3F8F5F"/>
    <rect x="672" y="88" width="300" height="14" fill="#3F8F5F"/>
    <text x="822" y="87" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">WS</text>
    <text x="822" y="122" text-anchor="middle" font-size="12.5" fill="#5A6B78">Scanner-averaged, water-suppressed</text>
    <text x="702" y="155" font-size="12" fill="#222B33">&#8226; NAA peak estimation</text>
    <text x="702" y="178" font-size="12" fill="#222B33">&#8226; Metabolite thermometry</text>
  </g>

  <!-- WS_RES -->
  <g>
    <rect x="996" y="60" width="300" height="216" rx="14" fill="#FFFFFF" stroke="#E85D04" stroke-width="2"/>
    <rect x="996" y="60" width="300" height="42" rx="14" fill="#E85D04"/>
    <rect x="996" y="88" width="300" height="14" fill="#E85D04"/>
    <text x="1146" y="87" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">WS_RES</text>
    <text x="1146" y="122" text-anchor="middle" font-size="12.5" fill="#5A6B78">Transient-resolved, water-suppressed</text>
    <text x="1026" y="155" font-size="12" fill="#222B33">&#8226; Transient alignment</text>
    <text x="1026" y="178" font-size="12" fill="#222B33">&#8226; Frequency-drift analysis</text>
    <text x="1026" y="201" font-size="12" fill="#222B33">&#8226; Optimized averaging</text>
  </g>
</svg>
